name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx lxml dnspython protego PyYAML pytest respx ruff
      - run: ruff check talon tests
      - run: pytest -q
