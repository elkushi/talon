[project]
name = "talon-monitor"
version = "0.1.0"
description = "Read-only website and domain monitor that reports to Telegram"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "dnspython>=2.6",
    "protego>=0.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"
respect-gitignore = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
